name: Release

# Keeps a release PR open on prod with the next versions and changelogs, built from Conventional Commit
# messages. Merging that PR tags each released component and creates its GitHub release:
#   - the app (root): vX.Y.Z. Railway deploys prod on its own once CI passes; nothing deploys here.
#   - the npm packages: client-vX.Y.Z, cli-vX.Y.Z, mcp-vX.Y.Z. pack-npm checks and packs them, then
#     publish-npm publishes those tarballs.
#
# npm trusted publishing (OIDC) authorizes this file by name, so keep `npm publish` in release-please.yml
# and don't move it into a reusable workflow. See docs/ci-and-releases.md#npm-packages.
on:
  push:
    branches: [prod]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        id: release
        with:
          # GITHUB_TOKEN works, but PRs it opens don't start CI. Add a RELEASE_PLEASE_TOKEN secret (a PAT
          # or app token with contents + pull-requests write) if the release PR should run the checks.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: ${{ github.ref_name }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Checks the commit and packs each released package. It installs every dev dependency and runs their
  # code, so it gets no id-token: nothing it runs can ask GitHub for the OIDC token that npm accepts.
  pack-npm:
    needs: release-please
    if: contains(needs.release-please.outputs.paths_released, 'packages/')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      node-version: ${{ steps.node.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # No dependency cache in a release job (a poisoned cache could reach the published package), so
      # this doesn't use ./.github/actions/setup. setup-node@v4 caches only when `cache:` is set.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
      - run: pnpm install --frozen-lockfile

      # CI runs on this same push in parallel, so check again here rather than publish an unchecked commit.
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

      - name: Pack released packages
        env:
          PATHS_RELEASED: ${{ needs.release-please.outputs.paths_released }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/npm-tarballs"
          scratch="$RUNNER_TEMP/npm-pack"
          mkdir -p "$out" "$scratch"
          n=0
          # client first: cli and mcp depend on it. The number in front of each tarball keeps that order
          # for publish-npm.
          for dir in packages/client packages/cli packages/mcp; do
            if ! jq -e --arg d "$dir" 'any(.[]; . == $d)' <<<"$PATHS_RELEASED" >/dev/null; then
              continue
            fi
            n=$((n + 1))
            # pnpm pack turns workspace:* into the real version, which npm pack wouldn't.
            # Public on npm, so anyone can install them, but UNLICENSED: the source is visible, all rights reserved.
            rm -f "$scratch"/*.tgz
            (cd "$dir" && pnpm pack --pack-destination "$scratch")
            tgz=$(echo "$scratch"/*.tgz)
            if tar -xOzf "$tgz" package/package.json | grep -q '"workspace:'; then
              echo "::error::$(basename "$tgz") still has a workspace: dependency"
              exit 1
            fi
            mv "$tgz" "$out/$n-$(basename "$tgz")"
          done
          ls -l "$out"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs/
          # Long enough to re-run a failed publish-npm on its own.
          retention-days: 7
          if-no-files-found: error

  # The only job with id-token: write. It runs no repository code and installs nothing: it downloads the
  # tarballs pack-npm made and hands them to the npm CLI that ships with Node.
  publish-npm:
    needs: [release-please, pack-npm]
    if: contains(needs.release-please.outputs.paths_released, 'packages/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The npm environment deploys only from prod. It has no required reviewers on purpose: a pending
    # approval would hold this run open, and Railway's "Wait for CI" waits on it.
    environment: npm
    permissions:
      id-token: write # npm trusted publishing: no npm token is stored anywhere
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarballs
          path: ${{ runner.temp }}/npm-tarballs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ needs.pack-npm.outputs.node-version }}
          registry-url: https://registry.npmjs.org

      - name: Check the npm CLI supports trusted publishing
        run: |
          npm --version
          node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            if (a < 11 || (a === 11 && (b < 5 || (b === 5 && c < 1)))) {
              console.error(`npm ${process.argv[1]} is too old for trusted publishing (needs 11.5.1+)`);
              process.exit(1);
            }' "$(npm --version)"

      - name: Publish the packed packages
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=("$RUNNER_TEMP"/npm-tarballs/*.tgz)
          if [ ${#tarballs[@]} -eq 0 ]; then
            echo "::error::no tarballs to publish"
            exit 1
          fi
          # The glob sorts by the number pack-npm put in front, so client goes first.
          for tgz in "${tarballs[@]}"; do
            manifest=$(tar -xOzf "$tgz" package/package.json)
            name=$(jq -r .name <<<"$manifest")
            version=$(jq -r .version <<<"$manifest")
            # A re-run, or the one-time manual first publish, may have published this version already.
            # The signed-in publish decides: npm refuses a version that exists, and that counts as done.
            if log=$(npm publish "$tgz" --access public --provenance 2>&1); then
              echo "$log"
              echo "::notice::published $name@$version"
            elif grep -qE 'EPUBLISHCONFLICT|cannot publish over (the )?previously published version' <<<"$log"; then
              echo "::notice::$name@$version is already on npm, skipping"
            else
              echo "$log"
              exit 1
            fi
          done
